<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procesando...</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #loading {
    width: min(90%, 420px);
    text-align: center;
  }
  h1 { font-size: 24px; margin-bottom: 25px; }
  .bar {
    width: 100%;
    height: 18px;
    background: #292929;
    border-radius: 10px;
    overflow: hidden;
  }
  #progress {
    height: 100%;
    width: 0%;
    background: #fff;
    transition: width .08s linear;
  }
  #status { margin-top: 15px; color: #aaa; }
  #videoWrap {
    display: none;
    width: 100%;
    max-width: 1000px;
    padding: 12px;
    text-align: center;
  }
  video {
    width: 100%;
    max-height: 90vh;
    background: black;
  }
  #sound {
    display: none;
    margin-top: 10px;
    padding: 12px 18px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
</style>
</head>
<body>

<div id="loading">
  <h1>Preparando tu contenido...</h1>
  <div class="bar"><div id="progress"></div></div>
  <div id="status">Inicializando...</div>
</div>

<div id="videoWrap">
  <video id="rick" playsinline autoplay muted controls>
    <source src="rickroll.mp4" type="video/mp4">
    Tu navegador no puede reproducir este video.
  </video>
  <button id="sound">🔊 Activar sonido</button>
</div>

<script>
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const loading = document.getElementById("loading");
const videoWrap = document.getElementById("videoWrap");
const video = document.getElementById("rick");
const sound = document.getElementById("sound");

let n = 0;
const timer = setInterval(() => {
  n += Math.random() * 7 + 2;
  if (n >= 100) {
    n = 100;
    clearInterval(timer);
    status.textContent = "¡Listo!";
    setTimeout(showVideo, 500);
  } else {
    status.textContent = n < 60 ? "Cargando contenido..." : "Finalizando...";
  }
  progress.style.width = n + "%";
}, 100);

function showVideo() {
  loading.style.display = "none";
  videoWrap.style.display = "block";
  video.play().catch(() => {
    sound.style.display = "inline-block";
  });
}

video.addEventListener("play", () => {
  if (video.muted) sound.style.display = "inline-block";
});

sound.addEventListener("click", () => {
  video.muted = false;
  video.play();
  sound.style.display = "none";
});
</script>

</body>
</html>
